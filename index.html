<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>INTOKINE</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Archivo+Narrow:wght@600;700&family=Raleway:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <!-- Digits only: Raleway's default numerals are old-style (uneven heights), so numbers use Barlow while letters stay Raleway. -->
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700;900&text=0123456789&display=swap" rel="stylesheet" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1c1c1c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="INTOKINE" />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        overscroll-behavior-y: none;
      }
      body {
        background-color: #1c1c1c;
        color: #ffffff;
        font-family: "Barlow", "Raleway", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 300;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overscroll-behavior-y: contain;
      }
      /* Brand fonts: Swiss 721 BT Bold Condensed for headers and sub-headers, Raleway for everything else.
         Swiss 721 BT is licensed, so it is used when its file is placed at public/fonts/Swiss721BT-BoldCondensed.woff2
         (or installed on the device). Until then Oswald (headers) and Archivo Narrow (sub-headers) stand in, as in the main app. */
      @font-face {
        font-family: "Swiss 721 BT Bold Condensed";
        src: local("Swiss 721 BT Bold Condensed"), local("Swiss721BT-BoldCondensed"), url("/fonts/Swiss721BT-BoldCondensed.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      /* Numbers always use Barlow (clean lining figures). The app uses font-mono for figures such as 83, 1:30 and dates. */
      .font-mono {
        font-family: "Barlow", "Raleway", sans-serif;
        font-variant-numeric: tabular-nums;
      }
      .font-header {
        font-family: "Swiss 721 BT Bold Condensed", "Oswald", "Arial Narrow", sans-serif;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .font-subheader {
        font-family: "Swiss 721 BT Bold Condensed", "Archivo Narrow", "Arial Narrow", sans-serif;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
